name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI notification contract
        run: bash tests/ci-notification-contract.sh

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: nix flake check
        run: |
          set -euo pipefail
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          nix flake check --no-build --print-build-logs
          nix build --print-build-logs \
            ".#checks.$system.module-render" \
            ".#checks.$system.config-opt-in" \
            ".#checks.$system.config-default-off" \
            ".#checks.$system.package-default-off" \
            ".#checks.$system.rtk-file-off" \
            ".#checks.$system.agents-file-off" \
            ".#checks.$system.package-opt-in" \
            ".#checks.$system.self-package-module" \
            ".#checks.$system.update-script-latest-selection" \
            ".#checks.$system.updater-mutation-only" \
            ".#checks.$system.generated-rtk" \
            ".#checks.$system.lint"

  # Required, not advisory: the package is a prebuilt-binary fetch (seconds),
  # and auto-merged bump PRs must prove it installs and reports the right
  # version before they can land.
  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Build and smoke-test the Codex package
        run: |
          set -euo pipefail
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          nix build --print-build-logs ".#checks.$system.codex-version"

  notify-ci:
    needs: [check, package-build, flakehub-publish, flakehub-verify]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify CI channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          CLEYTIN_USER_ID: "1532710143517659356"
        run: |
          if [[ -z "$WEBHOOK" ]]; then echo "::notice::DISCORD_CI_WEBHOOK not configured"; exit 0; fi
          jq -nc --arg cleytin "$CLEYTIN_USER_ID" --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg actor "$GITHUB_ACTOR" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{content:("<@"+$cleytin+">") ,allowed_mentions:{users:[$cleytin]},embeds:[{title:"CI FAILED",description:("**Repository:** `"+$repo+"`\n**Ref:** `"+$ref+"`\n**Actor:** `"+$actor+"`\n[Open workflow]("+$url+")"),color:15548997}]}' |
            curl -fsS -H "Content-Type: application/json" --data @- "$WEBHOOK"

  flakehub-publish:
    runs-on: ubuntu-latest
    needs: [check, package-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - uses: DeterminateSystems/flakehub-push@0e801cf490b3b3dcb099131a69146bc59d610d0f # main, pinned 2026-06-30
        with:
          name: ErikBPF/codex-flake
          rolling: true
          # Keep this release lane above any accidental stale 0.1.* publish.
          rolling-minor: 2
          visibility: public

  flakehub-verify:
    runs-on: ubuntu-latest
    needs: flakehub-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: FlakeHub wildcard resolves to this commit
        run: |
          set -euo pipefail
          metadata="$(nix flake metadata --refresh 'https://flakehub.com/f/ErikBPF/codex-flake/*' --json)"
          revision="$(printf '%s\n' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')"
          if [ "$revision" != "$GITHUB_SHA" ]; then
            printf 'FlakeHub wildcard resolved %s, expected %s\n' "$revision" "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Notify deploys channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_DEPLOYS_WEBHOOK }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then echo "::notice::DISCORD_DEPLOYS_WEBHOOK not configured"; exit 0; fi
          jq -nc --arg repo "$GITHUB_REPOSITORY" --arg sha "${GITHUB_SHA:0:12}" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{allowed_mentions:{parse:[]},embeds:[{title:"FLAKEHUB RELEASE VERIFIED",description:("**Repository:** `"+$repo+"`\n**Commit:** `"+$sha+"`\n[Open workflow]("+$url+")"),color:5763719}]}' |
            curl -fsS -H "Content-Type: application/json" --data @- "$WEBHOOK"
